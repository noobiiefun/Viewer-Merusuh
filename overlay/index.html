<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Viewer Merusuh — Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    padding: 16px;
    gap: 8px;
  }

  /* Status indicator — hanya muncul saat disconnect */
  #status-dot {
    position: fixed;
    top: 8px; right: 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ef4444;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #status-dot.disconnected { opacity: 1; }

  .notif {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(8, 8, 18, 0.92);
    border: 1px solid rgba(255,255,255,0.10);
    border-left: 4px solid #7c3aed;
    border-radius: 10px;
    padding: 12px 16px;
    max-width: 380px;
    width: 100%;
    backdrop-filter: blur(10px);
    overflow: hidden;
    animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .notif.hiding {
    animation: slideOut 0.35s ease-in forwards;
  }

  .notif-icon  { font-size: 26px; line-height: 1; flex-shrink: 0; }
  .notif-body  { flex: 1; min-width: 0; }
  .notif-platform {
    font-size: 10px; font-weight: 700; color: #a78bfa;
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1px;
  }
  .notif-donor {
    font-size: 15px; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .notif-amount { font-size: 13px; color: #86efac; font-weight: 600; margin-top: 1px; }
  .notif-effect {
    font-size: 12px; color: #fbbf24; font-weight: 600; margin-top: 4px;
  }
  .notif-msg {
    font-size: 11px; color: rgba(255,255,255,0.5);
    margin-top: 2px; font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .progress {
    position: absolute; bottom: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, #7c3aed, #a78bfa);
    animation: shrink linear forwards;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(70px) scale(0.95); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes slideOut {
    from { opacity: 1; transform: translateX(0); max-height: 200px; }
    to   { opacity: 0; transform: translateX(70px); max-height: 0; padding: 0; margin: 0; }
  }
  @keyframes shrink {
    from { width: 100%; }
    to   { width: 0%; }
  }
</style>
</head>
<body>
<div id="status-dot"></div>
<div id="container"></div>

<script>
// ── Konfigurasi ────────────────────────────────────────────────────
// Port dibaca dari URL parameter atau default 3000
// Contoh URL di OBS: http://localhost:3000/overlay
//                atau http://localhost:3001/overlay
const urlPort   = new URLSearchParams(location.search).get('port')
const serverPort = urlPort || location.port || '3000'
const SERVER_URL = location.hostname
  ? `${location.protocol}//${location.hostname}:${serverPort}`
  : `http://localhost:${serverPort}`

const NOTIF_DURATION_DEFAULT = 5000  // ms, di-override dari config server

// ── State ──────────────────────────────────────────────────────────
let notifDuration = NOTIF_DURATION_DEFAULT
let isConnected   = false
const container   = document.getElementById('container')
const statusDot   = document.getElementById('status-dot')

// ── Fetch config dari server ───────────────────────────────────────
async function loadConfig() {
  try {
    const res  = await fetch(SERVER_URL + '/api/config', { cache: 'no-store' })
    const data = await res.json()
    if (data?.data?.notification_duration_ms) {
      notifDuration = parseInt(data.data.notification_duration_ms)
    }
  } catch {}
}
loadConfig()
setInterval(loadConfig, 30000)

// ── Load socket.io dari server sendiri (bukan CDN) ─────────────────
// Ini lebih reliable di OBS karena tidak butuh internet
function loadSocketIO(callback) {
  // Coba load dari server lokal dulu
  const script = document.createElement('script')
  script.src = SERVER_URL + '/socket.io/socket.io.js'
  script.onload = callback
  script.onerror = () => {
    // Fallback ke CDN jika server tidak serve socket.io.js
    console.warn('Local socket.io not found, trying CDN...')
    const cdnScript = document.createElement('script')
    cdnScript.src = 'https://cdn.socket.io/4.7.4/socket.io.min.js'
    cdnScript.onload = callback
    cdnScript.onerror = () => {
      console.error('Cannot load socket.io!')
    }
    document.head.appendChild(cdnScript)
  }
  document.head.appendChild(script)
}

// ── Connect socket ─────────────────────────────────────────────────
function connectSocket() {
  if (typeof io === 'undefined') {
    console.error('socket.io not loaded')
    return
  }

  const socket = io(SERVER_URL, {
    transports:         ['websocket', 'polling'],
    reconnection:       true,
    reconnectionDelay:  1000,
    reconnectionAttempts: Infinity,
    timeout:            5000,
  })

  socket.on('connect', () => {
    isConnected = true
    statusDot.classList.remove('disconnected')
    console.log('Overlay connected to server')
  })

  socket.on('disconnect', () => {
    isConnected = false
    statusDot.classList.add('disconnected')
    console.log('Overlay disconnected, reconnecting...')
  })

  // Terima event efek → tampilkan notif
  socket.on('effect', (data) => {
    showNotif(data)
  })

  // Fallback: terima event donation jika tidak ada efek match
  socket.on('donation_no_effect', (data) => {
    showNotif({ donation: data, name: null })
  })
}

// ── Tampilkan notifikasi ───────────────────────────────────────────
const PLATFORM_ICONS = {
  saweria:  '🧋',
  trakteer: '☕',
  test:     '🧪',
  default:  '💜',
}

function formatRp(n) {
  return 'Rp ' + Number(n || 0).toLocaleString('id-ID')
}

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function showNotif(data) {
  const donation = data.donation || data
  const effectName = data.name || null
  const icon     = PLATFORM_ICONS[donation.platform] || PLATFORM_ICONS.default
  const duration = notifDuration

  const el = document.createElement('div')
  el.className = 'notif'
  el.innerHTML = `
    <div class="notif-icon">${icon}</div>
    <div class="notif-body">
      <div class="notif-platform">${esc(donation.platform)}</div>
      <div class="notif-donor">${esc(donation.donatorName)}</div>
      <div class="notif-amount">${formatRp(donation.amount)}</div>
      ${effectName ? `<div class="notif-effect">⚡ ${esc(effectName)}</div>` : ''}
      ${donation.message ? `<div class="notif-msg">"${esc(donation.message)}"</div>` : ''}
    </div>
    <div class="progress" style="animation-duration:${duration}ms"></div>
  `

  container.insertBefore(el, container.firstChild)

  // Auto remove setelah durasi
  setTimeout(() => {
    el.classList.add('hiding')
    setTimeout(() => el.remove(), 400)
  }, duration)

  // Maksimal 6 notif tampil bersamaan
  const all = container.querySelectorAll('.notif')
  if (all.length > 6) {
    const oldest = all[all.length - 1]
    oldest.classList.add('hiding')
    setTimeout(() => oldest.remove(), 400)
  }
}

// ── Init ───────────────────────────────────────────────────────────
loadSocketIO(() => {
  console.log('socket.io loaded, connecting...')
  connectSocket()
})

// ── Test visual (hilang setelah 3 detik) — untuk debug OBS ─────────
// Uncomment baris di bawah jika ingin test apakah overlay muncul di OBS:
// setTimeout(() => showNotif({ platform: 'test', donatorName: 'Test Viewer', amount: 10000, message: 'Test overlay OBS!' }), 1000)
</script>
</body>
</html>
