<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Viewer Merusuh — Overlay</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: transparent;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  width: 100vw; height: 100vh;
  position: relative;
}

/* ── NOTIFIKASI ──────────────────────────────── */
#notif-container {
  position: fixed;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
  max-width: 400px;
  width: 100%;
  /* posisi diatur via JS dari config */
}

.notif {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
  overflow: hidden;
  animation: notifIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
  /* warna dari config */
}
.notif.hiding { animation: notifOut 0.35s ease-in forwards; }

.notif-icon  { font-size: 24px; flex-shrink:0; }
.notif-body  { flex:1; min-width:0; }
.notif-platform { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; opacity:.7; }
.notif-donor    { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.notif-amount   { font-size:13px; font-weight:600; margin-top:1px; }
.notif-effect   { font-size:12px; font-weight:600; margin-top:3px; }
.notif-msg      { font-size:11px; opacity:.6; margin-top:2px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.notif-bar {
  position:absolute; bottom:0; left:0; height:3px;
  animation: shrink linear forwards;
}

/* ── PRICE LIST ──────────────────────────────── */
#pricelist-wrapper {
  position: fixed;
  z-index: 90;
  /* posisi diatur via JS */
}
#pricelist-inner {
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow: hidden;
  transition: opacity 0.5s;
}
#pricelist-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 8px;
  text-align: center;
  letter-spacing: -0.01em;
}
#pricelist-subtitle {
  font-size: 12px;
  text-align: center;
  margin-bottom: 10px;
  opacity: .7;
}

.price-item {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 6px;
  animation: itemIn 0.3s ease forwards;
}
.price-badge {
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 99px 0 0 99px;
  white-space: nowrap;
  min-width: 90px;
  text-align: center;
}
.price-label {
  font-size: 15px;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 0 99px 99px 0;
  flex: 1;
}

/* nav dots */
#pricelist-nav {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}
.nav-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  opacity: .35;
  transition: opacity .3s;
}
.nav-dot.active { opacity: 1; }

/* ── ANIMASI ─────────────────────────────────── */
@keyframes notifIn  { from{opacity:0;transform:translateX(60px)} to{opacity:1;transform:translateX(0)} }
@keyframes notifOut { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(60px)} }
@keyframes shrink   { from{width:100%} to{width:0%} }
@keyframes itemIn   { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<div id="notif-container"></div>
<div id="pricelist-wrapper">
  <div id="pricelist-title"></div>
  <div id="pricelist-subtitle"></div>
  <div id="pricelist-inner"></div>
  <div id="pricelist-nav"></div>
</div>

<script>
// ── Config default (di-override dari server) ──────────────────────
let CFG = {
  // Notifikasi
  notif_position:   'bottom-right',
  notif_bg:         '#0d0f14',
  notif_bg_opacity: '0.92',
  notif_border:     '#7c3aed',
  notif_text:       '#ffffff',
  notif_amount_color: '#86efac',
  notif_effect_color: '#fbbf24',
  notif_duration_ms:  5000,

  // Price List
  pricelist_show:      'true',
  pricelist_position:  'top-right',
  pricelist_title:     'Viewer Merusuh',
  pricelist_subtitle:  'List Harga Merusuh',
  pricelist_title_color: '#ffffff',
  pricelist_badge_bg:  '#000000',
  pricelist_badge_text:'#ffffff',
  pricelist_label_bg:  '#1e2330',
  pricelist_label_text:'#ffffff',
  pricelist_items_per_page: 5,
  pricelist_rotate_sec:     10,
  pricelist_hide_after_min: 5,
  pricelist_nav_color: '#7c3aed',
}

const PLATFORM_ICONS = {saweria:'🧋',trakteer:'☕',test:'🧪',default:'💜'}

function hex2rgba(hex, opacity) {
  const r = parseInt(hex.slice(1,3),16)
  const g = parseInt(hex.slice(3,5),16)
  const b = parseInt(hex.slice(5,7),16)
  return `rgba(${r},${g},${b},${opacity})`
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
function formatRp(n) {
  return 'Rp '+Number(n||0).toLocaleString('id-ID')
}

// ── Apply posisi notif ────────────────────────────────────────────
function applyNotifPosition() {
  const el  = document.getElementById('notif-container')
  const pos = CFG.notif_position
  el.style.cssText = ''
  el.style.position  = 'fixed'
  el.style.maxWidth  = '400px'
  el.style.width     = '100%'
  el.style.zIndex    = '100'
  if (pos.includes('bottom')) { el.style.bottom = '16px'; el.style.flexDirection = 'column' }
  else                        { el.style.top = '16px';    el.style.flexDirection = 'column-reverse' }
  if (pos.includes('right'))  el.style.right = '16px'
  else                        el.style.left  = '16px'
}

// ── Apply posisi price list ───────────────────────────────────────
function applyPricelistPosition() {
  const el  = document.getElementById('pricelist-wrapper')
  const pos = CFG.pricelist_position
  el.style.cssText = ''
  el.style.position = 'fixed'
  el.style.zIndex   = '90'
  el.style.minWidth = '220px'
  el.style.maxWidth = '400px'
  if (pos.includes('bottom')) el.style.bottom = '16px'
  else                        el.style.top    = '16px'
  if (pos.includes('right'))  el.style.right  = '16px'
  else                        el.style.left   = '16px'
  document.getElementById('pricelist-title').style.color    = CFG.pricelist_title_color
  document.getElementById('pricelist-subtitle').style.color = CFG.pricelist_title_color
}

// ── Notifikasi ────────────────────────────────────────────────────
const notifContainer = document.getElementById('notif-container')

function showNotif(data) {
  const donation   = data.donation || data
  const effectName = data.name || null
  const icon       = PLATFORM_ICONS[donation.platform] || PLATFORM_ICONS.default
  const duration   = CFG.notif_duration_ms
  const bgColor    = hex2rgba(CFG.notif_bg, CFG.notif_bg_opacity)

  const el = document.createElement('div')
  el.className = 'notif'
  el.style.background   = bgColor
  el.style.border       = `1px solid rgba(255,255,255,0.08)`
  el.style.borderLeft   = `4px solid ${CFG.notif_border}`
  el.style.color        = CFG.notif_text
  el.style.backdropFilter = 'blur(10px)'
  el.innerHTML = `
    <div class="notif-icon">${icon}</div>
    <div class="notif-body">
      <div class="notif-platform" style="color:${CFG.notif_border}">${esc(donation.platform)}</div>
      <div class="notif-donor">${esc(donation.donatorName)}</div>
      <div class="notif-amount" style="color:${CFG.notif_amount_color}">${formatRp(donation.amount)}</div>
      ${effectName?`<div class="notif-effect" style="color:${CFG.notif_effect_color}">⚡ ${esc(effectName)}</div>`:''}
      ${donation.message?`<div class="notif-msg">"${esc(donation.message)}"</div>`:''}
    </div>
    <div class="notif-bar" style="background:${CFG.notif_border};animation-duration:${duration}ms"></div>
  `
  notifContainer.insertBefore(el, notifContainer.firstChild)
  setTimeout(() => {
    el.classList.add('hiding')
    setTimeout(() => el.remove(), 400)
  }, duration)
  const all = notifContainer.querySelectorAll('.notif')
  if (all.length > 6) { all[all.length-1].classList.add('hiding'); setTimeout(()=>all[all.length-1].remove(),400) }
}

// ── Price List ────────────────────────────────────────────────────
let priceItems    = []
let currentPage   = 0
let rotateTimer   = null
let hideTimer     = null
let plVisible     = true

function buildPricelist(items) {
  priceItems = items || []
  currentPage = 0
  renderPage()
  startRotation()
  scheduleHide()
}

function renderPage() {
  const perPage = parseInt(CFG.pricelist_items_per_page) || 5
  const total   = priceItems.length
  const pages   = Math.ceil(total / perPage)
  const start   = currentPage * perPage
  const slice   = priceItems.slice(start, start + perPage)

  const inner = document.getElementById('pricelist-inner')
  const nav   = document.getElementById('pricelist-nav')

  // Items
  inner.innerHTML = slice.map((item, i) => `
    <div class="price-item" style="animation-delay:${i*0.05}s">
      <div class="price-badge" style="background:${CFG.pricelist_badge_bg};color:${CFG.pricelist_badge_text}">
        ${formatRp(item.min_amount)}
      </div>
      <div class="price-label" style="background:${CFG.pricelist_label_bg};color:${CFG.pricelist_label_text}">
        ${esc(item.name)}
      </div>
    </div>
  `).join('')

  // Nav dots
  if (pages > 1) {
    nav.innerHTML = Array.from({length:pages},(_,i)=>`
      <div class="nav-dot ${i===currentPage?'active':''}"
           style="background:${CFG.pricelist_nav_color}"></div>
    `).join('')
  } else {
    nav.innerHTML = ''
  }
}

function nextPage() {
  const perPage = parseInt(CFG.pricelist_items_per_page) || 5
  const pages   = Math.ceil(priceItems.length / perPage)
  if (pages <= 1) return
  currentPage = (currentPage + 1) % pages
  const inner = document.getElementById('pricelist-inner')
  inner.style.opacity = '0'
  setTimeout(() => { renderPage(); inner.style.opacity = '1' }, 300)
}

function startRotation() {
  clearInterval(rotateTimer)
  const perPage = parseInt(CFG.pricelist_items_per_page) || 5
  if (priceItems.length <= perPage) return  // tidak perlu rotate
  const rotateSec = Math.max(5, Math.min(30, parseInt(CFG.pricelist_rotate_sec) || 10))
  rotateTimer = setInterval(nextPage, rotateSec * 1000)
}

function scheduleHide() {
  clearTimeout(hideTimer)
  const wrapper = document.getElementById('pricelist-wrapper')
  const hideMin = Math.max(1, Math.min(15, parseInt(CFG.pricelist_hide_after_min) || 5))

  // Hitung durasi tampil berdasarkan rumus: kolom * rotate_sec + 20 detik
  const perPage   = parseInt(CFG.pricelist_items_per_page) || 5
  const pages     = Math.max(1, Math.ceil(priceItems.length / perPage))
  const rotateSec = parseInt(CFG.pricelist_rotate_sec) || 10
  const showSec   = pages * rotateSec + 20

  // Tampilkan selama showSec, lalu sembunyikan hingga hideMin berlalu, lalu tampilkan lagi
  function cycle() {
    wrapper.style.opacity    = '1'
    wrapper.style.transition = 'opacity 1s'
    plVisible = true
    hideTimer = setTimeout(() => {
      wrapper.style.opacity = '0'
      plVisible = false
      hideTimer = setTimeout(cycle, hideMin * 60 * 1000)
    }, showSec * 1000)
  }
  cycle()
}

// ── Fetch data dari server ────────────────────────────────────────
async function loadConfig() {
  try {
    const res  = await fetch(SERVER_URL+'/api/config', {cache:'no-store'})
    const data = await res.json()
    if (data?.data) {
      Object.assign(CFG, data.data)
      CFG.notif_duration_ms = parseInt(CFG.notification_duration_ms || CFG.notif_duration_ms || 5000)
    }
    applyNotifPosition()
    applyPricelistPosition()
    document.getElementById('pricelist-title').textContent    = CFG.pricelist_title || 'Viewer Merusuh'
    document.getElementById('pricelist-subtitle').textContent = CFG.pricelist_subtitle || 'List Harga Merusuh'
  } catch(e) { console.warn('Config load failed:', e.message) }
}

async function loadEffects() {
  try {
    const res  = await fetch(SERVER_URL+'/api/effects', {cache:'no-store'})
    const data = await res.json()
    if (data?.data) {
      const items = data.data
        .filter(e => e.is_active)
        .sort((a,b) => a.min_amount - b.min_amount)
      buildPricelist(items)
    }
  } catch(e) { console.warn('Effects load failed:', e.message) }
}

// ── Socket.io ─────────────────────────────────────────────────────
const urlPort    = new URLSearchParams(location.search).get('port')
const serverPort = urlPort || location.port || '3000'
const SERVER_URL = location.hostname
  ? `${location.protocol}//${location.hostname}:${serverPort}`
  : `http://localhost:${serverPort}`

function initSocket() {
  if (typeof io === 'undefined') return
  const socket = io(SERVER_URL, {
    transports:['websocket','polling'],
    reconnection:true, reconnectionDelay:1000,
  })
  socket.on('connect',    () => console.log('Overlay connected'))
  socket.on('disconnect', () => console.log('Overlay disconnected'))
  socket.on('effect',     data => showNotif(data))
  // Reload config & effects jika ada perubahan
  socket.on('config_updated', () => { loadConfig(); loadEffects() })
}

function loadSocketIO(cb) {
  const s = document.createElement('script')
  s.src = SERVER_URL+'/socket.io/socket.io.js'
  s.onload = cb
  s.onerror = () => {
    const s2 = document.createElement('script')
    s2.src = 'https://cdn.socket.io/4.7.4/socket.io.min.js'
    s2.onload = cb
    document.head.appendChild(s2)
  }
  document.head.appendChild(s)
}

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  await loadConfig()
  await loadEffects()
  loadSocketIO(initSocket)
  // Refresh tiap 60 detik
  setInterval(loadConfig,  60000)
  setInterval(loadEffects, 60000)
}

// Sembunyikan pricelist jika config bilang off
function checkPricelistVisibility() {
  const wrapper = document.getElementById('pricelist-wrapper')
  wrapper.style.display = (CFG.pricelist_show === 'true' || CFG.pricelist_show === true) ? '' : 'none'
}

init().then(checkPricelistVisibility)
</script>
</body>
</html>
