<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RC Controller — Viewer Merusuh</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #252525;
      --accent: #ff4444;
      --accent2: #ff8844;
      --text: #f0f0f0;
      --text-dim: #888;
      --border: #333;
      --green: #44ff88;
      --red: #ff4444;
      --yellow: #ffcc44;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .rc-name { font-size: 1rem; font-weight: 600; }
    .viewer-name { font-size: 0.8rem; color: var(--text-dim); }

    .timer {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--green);
      transition: color 0.3s;
    }
    .timer.warning { color: var(--yellow); }
    .timer.critical { color: var(--red); animation: pulse 0.5s infinite alternate; }

    @keyframes pulse { to { opacity: 0.5; } }

    /* ── Camera area ── */
    .cam-area {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .cam-placeholder {
      text-align: center;
      color: var(--text-dim);
    }
    .cam-placeholder .icon { font-size: 4rem; }
    .cam-placeholder p { margin-top: 8px; font-size: 0.85rem; }
    #cam-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* Simulasi posisi RC di canvas (mode simulator) */
    #sim-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Controls ── */
    .controls {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px;
      flex-shrink: 0;
    }

    /* D-pad style */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 6px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active, .btn.pressed {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(0.93);
    }
    .btn.center { background: var(--surface); cursor: default; }
    .btn.brake {
      background: var(--accent);
      border-color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .btn-wide {
      flex: 1;
      max-width: 140px;
      height: 50px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      display: inline-block;
      margin-right: 4px;
    }
    .status-dot.connected { background: var(--green); }

    /* ── Overlay pesan ── */
    .overlay-msg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
    }
    .overlay-msg h2 { font-size: 1.5rem; }
    .overlay-msg p { color: var(--text-dim); font-size: 0.9rem; text-align: center; padding: 0 32px; }
    .overlay-msg.hidden { display: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div>
      <div class="rc-name" id="rc-name">RC Controller</div>
      <div class="viewer-name" id="viewer-name">Menghubungkan...</div>
    </div>
  </div>
  <div class="timer" id="timer">--:--</div>
</div>

<!-- Kamera / Simulator canvas -->
<div class="cam-area">
  <img id="cam-feed" alt="Camera Feed" />
  <canvas id="sim-canvas"></canvas>
  <div class="cam-placeholder" id="cam-placeholder">
    <div class="icon">📷</div>
    <p>Kamera tidak tersedia<br>(Mode Simulator)</p>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <span><span class="status-dot" id="conn-dot"></span><span id="conn-label">Terputus</span></span>
  <span>🔋 <span id="battery">--%</span></span>
  <span>📶 <span id="latency">--ms</span></span>
</div>

<!-- D-pad controls -->
<div class="controls">
  <div class="dpad">
    <div></div>
    <button class="btn" id="btn-forward" data-cmd="forward">▲</button>
    <div></div>
    <button class="btn" id="btn-left" data-cmd="left">◄</button>
    <div class="btn center">●</div>
    <button class="btn" id="btn-right" data-cmd="right">►</button>
    <div></div>
    <button class="btn" id="btn-backward" data-cmd="backward">▼</button>
    <div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-wide brake" id="btn-brake">⏹ STOP</button>
    <button class="btn btn-wide" id="btn-horn">📯 Klakson</button>
  </div>
</div>

<!-- Overlay pesan -->
<div class="overlay-msg" id="overlay">
  <div class="spinner"></div>
  <h2>Menghubungkan...</h2>
  <p>Menyiapkan RC Controller</p>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  const TOKEN = params.get('token');
  const SERVER = location.origin;

  // ── State ────────────────────────────────────────────────────────────────────
  const keys = { forward: false, backward: false, left: false, right: false, brake: false };
  let sendInterval = null;
  let sessionData = null;
  let simState = { x: 150, y: 150, heading: 0 };

  // ── Socket.IO ────────────────────────────────────────────────────────────────
  const socket = io(SERVER, { transports: ['websocket'] });

  socket.on('connect', () => {
    setConnected(true);
    if (TOKEN) {
      socket.emit('join_viewer', { token: TOKEN });
    } else {
      showOverlay('❌ Token Tidak Ada', 'URL controller tidak valid. Minta link dari streamer.');
    }
  });

  socket.on('disconnect', () => setConnected(false));

  socket.on('session_info', (data) => {
    sessionData = data;
    document.getElementById('rc-name').textContent = `RC ${data.rc_id}`;
    document.getElementById('viewer-name').textContent = `Hei, ${data.viewer_name}!`;
    updateTimer(data.remaining_sec);
    hideOverlay();
    startSendLoop();
    startSimCanvas();
  });

  socket.on('session_tick', ({ remaining_sec }) => {
    updateTimer(remaining_sec);
  });

  socket.on('session_end', ({ reason }) => {
    stopSendLoop();
    const msg = reason === 'expired' ? 'Waktu habis!' : 'Sesi dihentikan oleh admin.';
    showOverlay('⏰ ' + msg, 'Terima kasih sudah main! Donasi lagi untuk dapat giliran berikutnya.');
  });

  socket.on('rc_state_update', ({ state }) => {
    if (state) simState = { x: 150 + state.x * 0.5, y: 150 - state.y * 0.5, heading: state.heading };
  });

  socket.on('battery_update', ({ battery_pct }) => {
    document.getElementById('battery').textContent = `${battery_pct}%`;
  });

  socket.on('error', ({ code, message }) => {
    if (code === 'INVALID_TOKEN') {
      showOverlay('❌ Token Tidak Valid', 'Link controller sudah expired atau tidak valid.');
    }
  });

  // ── Timer UI ─────────────────────────────────────────────────────────────────
  function updateTimer(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    const el = document.getElementById('timer');
    el.textContent = `${m}:${s}`;
    el.className = 'timer' + (sec <= 10 ? ' critical' : sec <= 30 ? ' warning' : '');
  }

  // ── Send loop ────────────────────────────────────────────────────────────────
  function startSendLoop() {
    if (sendInterval) return;
    sendInterval = setInterval(() => {
      const command = buildCommand();
      socket.emit('control', { token: TOKEN, command });
    }, 100);
  }

  function stopSendLoop() {
    if (sendInterval) clearInterval(sendInterval);
    sendInterval = null;
  }

  function buildCommand() {
    let forward = 0, turn = 0;
    if (keys.forward) forward = 0.9;
    if (keys.backward) forward = -0.9;
    if (keys.left) turn = -0.8;
    if (keys.right) turn = 0.8;
    return { forward, turn, brake: keys.brake };
  }

  // ── D-pad buttons ────────────────────────────────────────────────────────────
  function mapBtnToKey(cmd) {
    return { forward: 'forward', backward: 'backward', left: 'left', right: 'right' }[cmd] || cmd;
  }

  document.querySelectorAll('.btn[data-cmd]').forEach(btn => {
    const cmd = btn.dataset.cmd;
    const key = mapBtnToKey(cmd);

    const press = (e) => {
      e.preventDefault();
      keys[key] = true;
      btn.classList.add('pressed');
    };
    const release = (e) => {
      e.preventDefault();
      keys[key] = false;
      btn.classList.remove('pressed');
    };

    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  document.getElementById('btn-brake').addEventListener('pointerdown', e => {
    e.preventDefault();
    keys.brake = true;
    socket.emit('control', { token: TOKEN, command: { forward: 0, turn: 0, brake: true } });
  });
  document.getElementById('btn-brake').addEventListener('pointerup', () => { keys.brake = false; });

  // ── Keyboard support ─────────────────────────────────────────────────────────
  const keyMap = { ArrowUp: 'forward', ArrowDown: 'backward', ArrowLeft: 'left', ArrowRight: 'right', Space: 'brake', KeyW: 'forward', KeyS: 'backward', KeyA: 'left', KeyD: 'right' };

  window.addEventListener('keydown', e => {
    const k = keyMap[e.code];
    if (k) { keys[k] = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    const k = keyMap[e.code];
    if (k) { keys[k] = false; }
  });

  // ── Simulator canvas ─────────────────────────────────────────────────────────
  function startSimCanvas() {
    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      simState.x = canvas.width / 2;
      simState.y = canvas.height / 2;
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // Grid background
      ctx.strokeStyle = '#1f1f1f';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

      // RC body
      const rad = (simState.heading * Math.PI) / 180;
      ctx.save();
      ctx.translate(simState.x, simState.y);
      ctx.rotate(rad);

      // Body RC
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.roundRect(-12, -18, 24, 36, 4);
      ctx.fill();

      // Depan
      ctx.fillStyle = '#ff8888';
      ctx.beginPath();
      ctx.roundRect(-8, -22, 16, 10, 3);
      ctx.fill();

      // Roda
      ctx.fillStyle = '#333';
      [[-14, -14], [14, -14], [-14, 14], [14, 14]].forEach(([rx, ry]) => {
        ctx.beginPath();
        ctx.roundRect(rx - 4, ry - 6, 8, 12, 2);
        ctx.fill();
      });

      ctx.restore();

      requestAnimationFrame(draw);
    }
    draw();
  }

  // ── UI helpers ────────────────────────────────────────────────────────────────
  function setConnected(yes) {
    document.getElementById('conn-dot').className = 'status-dot' + (yes ? ' connected' : '');
    document.getElementById('conn-label').textContent = yes ? 'Terhubung' : 'Terputus';
  }

  function showOverlay(title, msg) {
    const el = document.getElementById('overlay');
    el.innerHTML = `<h2>${title}</h2><p>${msg}</p>`;
    el.classList.remove('hidden');
  }

  function hideOverlay() {
    document.getElementById('overlay').classList.add('hidden');
  }

  // Ping latency (estimasi sederhana)
  let pingStart = Date.now();
  setInterval(() => {
    pingStart = Date.now();
    socket.emit('ping');
  }, 2000);
  socket.on('pong', () => {
    document.getElementById('latency').textContent = `${Date.now() - pingStart}ms`;
  });
</script>
</body>
</html>
