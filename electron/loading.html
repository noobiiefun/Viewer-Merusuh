<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Viewer Merusuh</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0d0f14;
    color: #e8eaf0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 16px;
    user-select: none;
    -webkit-app-region: drag;
    overflow: hidden;
  }

  .logo-wrap {
    width: 110px; height: 110px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(124,58,237,0.5);
    animation: pulse 2.5s ease-in-out infinite;
    background: #111;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-wrap img { width:100%; height:100%; object-fit:cover; }
  .logo-emoji { font-size:64px; }

  .title { font-size:26px; font-weight:800; letter-spacing:-0.02em; }
  .title span { color:#7c3aed; }
  .tagline { font-size:12px; color:#555e78; letter-spacing:0.05em; text-transform:uppercase; }

  .steps { display:flex; flex-direction:column; gap:8px; margin-top:8px; min-width:280px; }
  .step {
    display:flex; align-items:center; gap:10px;
    font-size:13px; color:#8b92a8;
    padding:7px 14px; border-radius:8px;
    background:rgba(255,255,255,0.04);
    transition:all 0.4s;
  }
  .step.done   { color:#22c55e; background:rgba(34,197,94,0.08); }
  .step.active { color:#e8eaf0; background:rgba(124,58,237,0.12); border:1px solid rgba(124,58,237,0.2); }
  .step-icon { width:18px; text-align:center; flex-shrink:0; font-size:14px; }

  .dots { display:flex; gap:8px; margin-top:4px; }
  .dot {
    width:7px; height:7px; border-radius:50%;
    background:#7c3aed; opacity:.25;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2){ animation-delay:.2s; }
  .dot:nth-child(3){ animation-delay:.4s; }

  .version { position:fixed; bottom:16px; font-size:11px; color:#2a2f3f; }

  @keyframes pulse  { 0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(124,58,237,0.4)} 50%{transform:scale(1.04);box-shadow:0 0 60px rgba(124,58,237,0.7)} }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.25} 40%{transform:translateY(-8px);opacity:1} }
</style>
</head>
<body>
  <!-- Logo: coba load dari resources/, fallback ke emoji -->
  <div class="logo-wrap" id="logo-wrap">
    <img id="logo-img" src="" alt="" style="display:none"
      onload="this.style.display='block'; document.getElementById('logo-emoji').style.display='none'"
      onerror="this.style.display='none'; document.getElementById('logo-emoji').style.display='block'" />
    <span class="logo-emoji" id="logo-emoji">🎮</span>
  </div>

  <div class="title">Viewer <span>Merusuh</span></div>
  <div class="tagline">Penonton Bayar, Game Kacau.</div>

  <div class="steps">
    <div class="step done"   id="s1"><span class="step-icon">✅</span> Inisialisasi aplikasi</div>
    <div class="step active" id="s2"><span class="step-icon">⚙️</span> Memulai server...</div>
    <div class="step"        id="s3"><span class="step-icon">◯</span> Memuat dashboard</div>
  </div>

  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="version">v1.0.0</div>

  <script>
    // Coba load logo dari beberapa path
    const paths = [
      '../resources/icon.png',
      './resources/icon.png',
      '../icon.png',
    ]
    const img = document.getElementById('logo-img')
    let idx = 0
    function tryNext() {
      if (idx >= paths.length) return
      img.src = paths[idx++]
    }
    img.onerror = tryNext
    tryNext()

    // Animasi progress steps
    setTimeout(() => {
      const s2 = document.getElementById('s2')
      s2.className = 'step done'
      s2.innerHTML = '<span class="step-icon">✅</span> Server berjalan'
      const s3 = document.getElementById('s3')
      s3.className = 'step active'
      s3.innerHTML = '<span class="step-icon">⏳</span> Memuat dashboard...'
    }, 2500)
  </script>
</body>
</html>
