<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Viewer Merusuh — Starting...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #e8eaf0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 24px;
    user-select: none;
  }
  .logo { font-size: 64px; animation: pulse 2s ease-in-out infinite; }
  .title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .title span { color: #7c3aed; }
  .subtitle {
    font-size: 14px;
    color: #8b92a8;
  }
  .dots {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #7c3aed;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  .version {
    position: fixed;
    bottom: 20px;
    font-size: 11px;
    color: #555e78;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.05); }
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40%           { transform: translateY(-8px); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="logo">🎮</div>
  <div class="title">Viewer <span>Merusuh</span></div>
  <div class="subtitle">Memulai server...</div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="version">v1.0.0</div>
</body>
</html>
