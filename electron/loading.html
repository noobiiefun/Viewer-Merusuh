<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Viewer Merusuh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #e8eaf0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 20px;
    user-select: none;
    -webkit-app-region: drag;
  }
  .logo { font-size: 64px; animation: pulse 2s ease-in-out infinite; }
  .title { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .title span { color: #7c3aed; }
  .steps { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .step {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: #8b92a8;
    padding: 6px 14px; border-radius: 6px;
    background: rgba(255,255,255,0.04);
    transition: all 0.3s;
  }
  .step.done  { color: #22c55e; }
  .step.active { color: #e8eaf0; background: rgba(124,58,237,0.15); }
  .step-icon { width: 18px; text-align: center; flex-shrink: 0; }
  .dots { display: flex; gap: 8px; margin-top: 8px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #7c3aed; opacity: 0.3;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  .version { position: fixed; bottom: 20px; font-size: 11px; color: #555e78; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.3; } 40% { transform: translateY(-8px); opacity: 1; } }
</style>
</head>
<body>
  <div class="logo">🎮</div>
  <div class="title">Viewer <span>Merusuh</span></div>

  <div class="steps">
    <div class="step done"  id="s1"><span class="step-icon">✅</span> Inisialisasi aplikasi</div>
    <div class="step active" id="s2"><span class="step-icon">⏳</span> Memulai server...</div>
    <div class="step"        id="s3"><span class="step-icon">◯</span> Memuat dashboard</div>
  </div>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="version">v1.0.0</div>

  <script>
    // Simulasi progress visual (server load butuh ~1-3 detik)
    setTimeout(() => {
      document.getElementById('s2').className = 'step done'
      document.getElementById('s2').querySelector('.step-icon').textContent = '✅'
      document.getElementById('s2').innerHTML = '<span class="step-icon">✅</span> Server berjalan'
      document.getElementById('s3').className = 'step active'
      document.getElementById('s3').innerHTML = '<span class="step-icon">⏳</span> Memuat dashboard...'
    }, 2000)
  </script>
</body>
</html>
